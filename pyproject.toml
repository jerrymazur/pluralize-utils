[project]
name = "pluralize-utils"
version = "0.1.0"
description = "Converts singular English words to plural and back, with explicit handling of irregular forms."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
